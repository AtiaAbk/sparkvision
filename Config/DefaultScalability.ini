[ScalabilitySettings]
; ==============================================================================
; SPARKVISION MULTI-TIER SCALABILITY PROFILES (Apple Silicon M4 / 16GB Unified RAM)
; Level 1: Optimized (Balanced 60 FPS Target, Minimum Thermal Footprint)
; Level 2: High Quality (Standard Gameplay, Rich Foliage & Lumen)
; Level 3: Cinematic (Hero Screenshot & Presentation Fidelity)
; ==============================================================================

; --- VIEW DISTANCE QUALITY ---
[ViewDistanceQuality@1]
r.ViewDistanceScale=0.75
r.StaticMeshLODDistanceScale=1.25

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.85
r.StaticMeshLODDistanceScale=1.15

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
r.StaticMeshLODDistanceScale=1.0

