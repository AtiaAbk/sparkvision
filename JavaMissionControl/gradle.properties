# SparkVision MissionControl Gradle Daemon & Memory Cap Configuration
# Optimized for Apple Silicon M4 (16GB Unified Memory)
org.gradle.jvmargs=-Xmx512m -XX:+UseG1GC -XX:+TieredCompilation -XX:TieredStopAtLevel=1
org.gradle.daemon=true
org.gradle.daemon.idletimeout=180000
org.gradle.parallel=false
org.gradle.vfs.watch=true
